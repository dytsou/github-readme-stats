
      <svg
        width="495"
        height="165"
        viewBox="0 0 495 165"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-labelledby="descId"
      >
        <title id="titleId"></title>
        <desc id="descId"></desc>
        <style>
          .header {
            font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
            fill: #fe428e;
            animation: fadeInAnimation 0.8s ease-in-out forwards;
          }
          @supports(-moz-appearance: auto) {
            /* Selector detects Firefox */
            .header { font-size: 15.5px; }
          }
          
    
    .stat {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #a9fef7;
    }
    @supports(-moz-appearance: auto) {
      /* Selector detects Firefox */
      .stat { font-size:12px; }
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    .not_bold { font-weight: 400 }
    .bold { font-weight: 700 }
  
    @keyframes slideInAnimation {
      from {
        width: 0;
      }
      to {
        width: calc(100%-100px);
      }
    }
    @keyframes growWidthAnimation {
      from {
        width: 0;
      }
      to {
        width: 100%;
      }
    }
    .lang-name { font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #a9fef7 }
    #rect-mask rect{
      animation: slideInAnimation 1s ease-in-out forwards;
    }
    .lang-progress{
      animation: growWidthAnimation 0.6s ease-in-out forwards;
    }
    

          
          
      * { animation-duration: 0s !important; animation-delay: 0s !important; }
      .stagger { opacity: 1 !important; }
      #rect-mask rect { animation: none !important; }
      .lang-progress { animation: none !important; }
    
        </style>

        

        <rect
          data-testid="card-bg"
          x="0.5"
          y="0.5"
          rx="4.5"
          height="99%"
          stroke="#e4e2e2"
          width="494"
          fill="#141321"
          stroke-opacity="1"
        />

        
      <g
        data-testid="card-title"
        transform="translate(25, 35)"
      >
        <g transform="translate(0, 0)">
      <text
        x="0"
        y="0"
        class="header"
        data-testid="header"
      >WakaTime Stats (last 7 days)</text>
    </g>
      </g>
    

        <g
          data-testid="main-card-body"
          transform="translate(0, 55)"
        >
          
    <svg x="0" y="0" width="100%">
      
      <mask id="rect-mask">
      <rect x="25" y="0" width="440" height="8" fill="white" rx="5" />
      </mask>
      
          <rect
            mask="url(#rect-mask)"
            data-testid="lang-progress"
            x="0"
            y="0"
            width="204.6"
            height="8"
            fill="#3178c6"
          />
        
          <rect
            mask="url(#rect-mask)"
            data-testid="lang-progress"
            x="204.6"
            y="0"
            width="97.65"
            height="8"
            fill="#f1e05a"
          />
        
          <rect
            mask="url(#rect-mask)"
            data-testid="lang-progress"
            x="302.25"
            y="0"
            width="60.45"
            height="8"
            fill="#00ADD8"
          />
        
          <rect
            mask="url(#rect-mask)"
            data-testid="lang-progress"
            x="362.7"
            y="0"
            width="51.15"
            height="8"
            fill="#dea584"
          />
        
          <rect
            mask="url(#rect-mask)"
            data-testid="lang-progress"
            x="413.84999999999997"
            y="0"
            width="32.55"
            height="8"
            fill="#cb171e"
          />
        
          <rect
            mask="url(#rect-mask)"
            data-testid="lang-progress"
            x="446.4"
            y="0"
            width="18.6"
            height="8"
            fill="#858585"
          />
        
      
    <g transform="translate(25, 25)">
      <circle cx="5" cy="6" r="5" fill="#3178c6" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        TypeScript - 14 hrs 20 mins
      </text>
    </g>
  
    <g transform="translate(230, 25)">
      <circle cx="5" cy="6" r="5" fill="#f1e05a" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        JavaScript - 6 hrs 45 mins
      </text>
    </g>
  
    <g transform="translate(25, 50)">
      <circle cx="5" cy="6" r="5" fill="#00ADD8" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        Go - 4 hrs 10 mins
      </text>
    </g>
  
    <g transform="translate(230, 50)">
      <circle cx="5" cy="6" r="5" fill="#dea584" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        Rust - 3 hrs 30 mins
      </text>
    </g>
  
    <g transform="translate(25, 75)">
      <circle cx="5" cy="6" r="5" fill="#cb171e" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        YAML - 2 hrs 15 mins
      </text>
    </g>
  
    <g transform="translate(230, 75)">
      <circle cx="5" cy="6" r="5" fill="#858585" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        Other - 1 hr 20 mins
      </text>
    </g>
  
    
    </svg>
  
        </g>
      </svg>
    