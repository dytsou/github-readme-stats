          .hero-label { font: 600 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #a9fef7; opacity: 0.75 }
    .hero { font: 800 48px 'Segoe UI', Ubuntu, Sans-Serif; fill: #fe428e }
    .hero-unit { font: 600 16px 'Segoe UI', Ubuntu, Sans-Serif; fill: #fe428e; opacity: 0.95 }
