name: Publish to npmjs & GitHub Packages

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "src/**"
      - "config/**"
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Publish to npmjs
        id: npmjs
        uses: dytsou/release/npm-publish@2096b0a3163d8d77127c0e276fc1cda7da3c63e2 # v1.2.0 (@v1)
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}

      - name: Publish to GitHub Packages
        id: ghpkg
        uses: dytsou/release/github-packages@2096b0a3163d8d77127c0e276fc1cda7da3c63e2 # v1.2.0 (@v1)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Skip reinstall when npmjs already installed deps in this job.
          install-deps:
            ${{ steps.npmjs.outputs.published == 'true' && 'false' || 'true' }}
          verify-pack:
            ${{ steps.npmjs.outputs.published == 'true' && 'false' || 'true' }}

      - name: GitHub Release
        if:
          steps.npmjs.outputs.published == 'true' ||
          steps.ghpkg.outputs.published == 'true'
        uses: dytsou/release/github@2096b0a3163d8d77127c0e276fc1cda7da3c63e2 # v1.2.0 (@v1)
        with:
          from-package-json: "true"
          move-major-tag: "false"
          body: |
            ## ${{ steps.npmjs.outputs.name }}@${{ steps.npmjs.outputs.version }}

            **Published to multiple registries:**

            - **npmjs.com**: https://www.npmjs.com/package/${{ steps.npmjs.outputs.name }}

            - **GitHub Packages**: https://github.com/${{ github.repository }}/packages

            *Note: If a registry already had this version, it was skipped. Only missing registries were published.*

            ### Installation

            **From npmjs (default):**

            ```bash
            npm install ${{ steps.npmjs.outputs.name }}

            # or

            pnpm install ${{ steps.npmjs.outputs.name }}
            ```

            **From GitHub Packages:**

            First, create or update your `.npmrc` file:

            ```ini
            @dytsou:registry=https://npm.pkg.github.com
            //npm.pkg.github.com/:_authToken=YOUR_GITHUB_TOKEN
            ```

            Then install:

            ```bash
            npm install ${{ steps.npmjs.outputs.name }}

            # or

            pnpm install ${{ steps.npmjs.outputs.name }}
            ```

      - name: Publish summary
        if: always()
        run: |
          echo "## Publish Summary"
          echo "### npmjs"
          if [ "${{ steps.npmjs.outputs.skipped }}" == "true" ]; then
            echo "Skipped - version already exists"
          elif [ "${{ steps.npmjs.outputs.published }}" == "true" ]; then
            echo "Published successfully"
          else
            echo "Not published"
          fi
          echo ""
          echo "### GitHub Packages"
          if [ "${{ steps.ghpkg.outputs.skipped }}" == "true" ]; then
            echo "Skipped - version already exists"
          elif [ "${{ steps.ghpkg.outputs.published }}" == "true" ]; then
            echo "Published successfully"
          else
            echo "Not published"
          fi
