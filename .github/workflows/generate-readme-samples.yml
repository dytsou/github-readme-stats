name: Generate readme sample SVGs

on:
  push:
    branches:
      - main
      - master
    paths:
      - "src/cards/**"
      - "src/common/Card.js"
      - "src/common/color.js"
      - "src/common/render.js"
      - "scripts/generate-readme-samples.js"
      - "themes/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    if: github.repository == 'dytsou/github-readme-stats'
    name: Regenerate readme preview SVGs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          CI: true

      - name: Generate readme sample SVGs
        run: pnpm run generate-readme-samples

      - name: Create Pull Request if sample SVGs changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: regenerate readme sample SVGs"
          branch: "ci/readme-sample-svgs"
          delete-branch: true
          title: Regenerate readme sample SVGs
          body: |
            Auto-generated by [generate-readme-samples](https://github.com/dytsou/github-readme-stats/actions/workflows/generate-readme-samples.yml) after card renderer changes.
          labels: "ci, documentation"
          add-paths: |
            docs/assets/readme/*.svg
