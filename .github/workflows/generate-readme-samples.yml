name: Generate readme sample SVGs

on:
  push:
    branches:
      - main
      - master
    paths:
      - "src/cards/**"
      - "src/common/Card.js"
      - "src/common/color.js"
      - "src/common/render.js"
      - "scripts/generate-readme-samples.js"
      - "themes/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    if: github.repository == 'dytsou/github-readme-stats'
    name: Regenerate and commit readme preview SVGs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          CI: true

      - name: Generate readme sample SVGs
        run: pnpm run generate-readme-samples

      - name: Commit sample SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/assets/readme/*.svg
          git diff --staged --quiet && echo "No SVG changes" && exit 0
          git commit --no-verify -m "chore: regenerate readme sample SVGs"
          git push
