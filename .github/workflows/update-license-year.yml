name: Update LICENSE year
on:
  schedule:
    - cron: "0 0 1 1 *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  updateLicenseYear:
    if: github.repository == 'dytsou/github-readme-stats'
    name: Update LICENSE copyright year
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Update LICENSE year
        id: update
        run: node scripts/update-license-year.js

      - name: Create Pull Request if LICENSE year was updated
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message:
            "chore: update LICENSE copyright year to ${{ github.event.schedule
            || 'current' }}"
          branch: "update-license-year/auto"
          delete-branch: true
          title: "chore: update LICENSE copyright year"
          body: |
            This PR automatically updates the LICENSE file to use the current year for dytsou's copyright.

            This update was triggered by the [update-license-year](https://github.com/dytsou/github-readme-stats/actions/workflows/update-license-year.yml) workflow.
          labels: "ci, maintenance"
