name: Update LICENSE year
on:
  schedule:
    - cron: "0 0 1 1 *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  updateLicenseYear:
    if: github.repository == 'dytsou/github-readme-stats'
    name: Update LICENSE copyright year
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Update LICENSE year
        id: update
        run: node scripts/update-license-year.js

      - name: Create Pull Request if LICENSE year was updated
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message:
            "chore: update LICENSE copyright year to ${{ github.event.schedule
            || 'current' }}"
          branch: "update-license-year/auto"
          delete-branch: true
          title: "chore: update LICENSE copyright year"
          body: |
            This PR automatically updates the LICENSE file to use the current year for dytsou's copyright.

            This update was triggered by the [update-license-year](https://github.com/dytsou/github-readme-stats/actions/workflows/update-license-year.yml) workflow.
          labels: "ci, maintenance"
