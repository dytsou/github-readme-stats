name: Update LICENSE year
on:
  schedule:
    - cron: "0 0 1 1 *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  updateLicenseYear:
    if: github.repository == 'dytsou/github-readme-stats'
    name: Update LICENSE copyright year
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Update LICENSE year
        id: update
        run: node scripts/update-license-year.js

      - name: Create Pull Request if LICENSE year was updated
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message:
            "chore: update LICENSE copyright year to ${{ github.event.schedule
            || 'current' }}"
          branch: "update-license-year/auto"
          delete-branch: true
          title: "chore: update LICENSE copyright year"
          body: |
            This PR automatically updates the LICENSE file to use the current year for dytsou's copyright.

            This update was triggered by the [update-license-year](https://github.com/dytsou/github-readme-stats/actions/workflows/update-license-year.yml) workflow.
          labels: "ci, maintenance"
