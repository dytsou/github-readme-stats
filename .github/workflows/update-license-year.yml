name: Update LICENSE year
on:
  schedule:
    - cron: "0 0 1 1 *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  updateLicenseYear:
    if: github.repository == 'dytsou/github-readme-stats'
    name: Update LICENSE copyright year
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          CI: true

      - name: Update LICENSE year
        id: update
        run: node scripts/update-license-year.js

      - name: Create Pull Request if LICENSE year was updated
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message:
            "chore: update LICENSE copyright year to ${{ github.event.schedule
            || 'current' }}"
          branch: "update-license-year/auto"
          delete-branch: true
          title: "chore: update LICENSE copyright year"
          body: |
            This PR automatically updates the LICENSE file to use the current year for dytsou's copyright.

            This update was triggered by the [update-license-year](https://github.com/dytsou/github-readme-stats/actions/workflows/update-license-year.yml) workflow.
          labels: "ci, maintenance"
